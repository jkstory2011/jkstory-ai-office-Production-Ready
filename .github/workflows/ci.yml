name: JKSTORY Office CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source checks
        run: npm run check

      - name: Web Handler integration test
        run: node scripts/web-handler-test.mjs
